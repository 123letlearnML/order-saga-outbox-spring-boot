server:
  port: ${PORT:8093}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/saga_payment?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:devuser}
    password: ${DB_PASSWORD:devuser_local_123}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  # Bảng outbox/inbox của thư viện messaging được migrate riêng (MessagingConfig), lịch sử riêng.

saga:
  mode: ${SAGA_MODE:OUTBOX}
  service: payment
  peers:
    order: ${ORDER_URL:http://localhost:8091}
  relay:
    max-retry-seconds: ${SAGA_RELAY_MAX_RETRY_SECONDS:1800}
  chaos:
    duplicate-rate: ${SAGA_DUPLICATE_RATE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

payment:
  # % đơn bị ngân hàng từ chối thẻ (cố định theo orderId để giao lại vẫn ra cùng kết quả) => kích hoạt saga bù trừ
  decline-percent: ${PAYMENT_DECLINE_PERCENT:10}
