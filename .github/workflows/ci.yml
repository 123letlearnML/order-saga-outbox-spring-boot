name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Tests + chaos test (kill -9)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # Trong CI, app kết nối từ ngoài container nên user 'devuser'@'localhost' không khớp => dùng root.
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tạo database
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot < scripts/mysql-setup.sql
      - name: Unit + integration tests (MySQL thật)
        working-directory: backend
        run: ./mvnw -B -ntp package
      - name: Chaos test — 600 đơn, kill -9 ngẫu nhiên, đối soát chéo 3 database
        working-directory: chaos
        run: node chaos.mjs --mode OUTBOX --orders 600 --rate 20 --kill-every 6 --assert
      - name: Lưu kết quả chaos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results
          path: |
            chaos/results/
            chaos/logs/

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
